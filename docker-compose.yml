version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: parcial-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [app_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: parcial-api
    depends_on:
      db:
        condition: service_healthy
    env_file: [.env]
    ports:
      - "${PORT}:3000"
    networks: [app_net]

volumes:
  db_data:

networks:
  app_net:
